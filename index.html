<!-- 版本：2026-11-22 #3 17:05 PWA、圖示；版本註解改字（不影響功能） -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src https://cdnjs.cloudflare.com; img-src 'self' data: https:; connect-src https://script.google.com https://script.googleusercontent.com; base-uri 'none'; manifest-src 'self'; form-action 'none'">
<title>小賴助理</title>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f5f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1c1a" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="小賴助理">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- 圖示：綠色圓角方塊 + 對話框 + 星光 (= LINE 對話 + AI)，無印風格的簡單線面 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="logo" viewBox="0 0 48 48">
    <rect width="48" height="48" rx="12" style="fill:var(--brand)"/>
    <path d="M13 13.5h22a4.5 4.5 0 0 1 4.5 4.5v11a4.5 4.5 0 0 1-4.5 4.5H26.5L20 39.5v-6h-7A4.5 4.5 0 0 1 8.5 29V18A4.5 4.5 0 0 1 13 13.5z" fill="#fff"/>
    <path d="M24 17.2l1.9 4.8 4.8 1.9-4.8 1.9L24 30.6l-1.9-4.8-4.8-1.9 4.8-1.9z" style="fill:var(--brand)"/>
  </symbol>
</svg>

<!-- 登入 -->
<div id="login" class="login hidden">
  <div class="card">
    <svg class="logo" viewBox="0 0 48 48" aria-hidden="true"><use href="#logo"/></svg>
    <h1>小賴助理</h1>
    <input id="pw" type="password" autocomplete="current-password" placeholder="密碼" aria-label="密碼">
    <button id="loginBtn" class="btn">登入</button>
    <div id="loginErr" class="err" role="alert"></div>
  </div>
</div>

<!-- 主畫面 -->
<div id="app" class="wrap hidden">
  <header class="card top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 48 48" aria-hidden="true"><use href="#logo"/></svg>
      <h1>小賴助理</h1>
    </div>
    <nav id="tabs" class="tabs" aria-label="分頁"></nav>
    <div class="acts">
      <button id="gsBtn" class="ibtn" title="搜尋全部資料" aria-label="搜尋全部資料"><i class="fa-solid fa-magnifying-glass"></i></button>
      <button id="refreshBtn" class="ibtn" title="重新整理" aria-label="重新整理"><i class="fa-solid fa-rotate"></i></button>
    </div>
  </header>
  <main id="view" class="page"></main>
</div>

<div id="modal" class="ov hidden"></div>
<div id="modal2" class="ov top2 hidden"></div>
<div id="toast" class="toast hidden" role="status"></div>


<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
